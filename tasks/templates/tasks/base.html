<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}To-Do List{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    a { color: #2563eb; }
    ul.tasks { list-style: none; padding: 0; }
    ul.tasks li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #ddd; }
    ul.tasks li .title { flex: 1; }
    ul.tasks li.done .title { text-decoration: line-through; color: #999; }
    ul.tasks form { margin: 0; }
    .errorlist { color: #dc2626; }
    .filters a.active { font-weight: bold; text-decoration: none; color: black; }
    .priority { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
    .p1 { background: #fee2e2; color: #b91c1c; }   /* High */
    .p2 { background: #fef3c7; color: #92400e; }   /* Medium */
    .p3 { background: #dcfce7; color: #166534; }   /* Low */
    .overdue { color: #dc2626; font-weight: bold; }
    .msg { padding: 8px 12px; border-radius: 6px; }
    .msg-success { background: #dcfce7; color: #166534; }
    .msg-info    { background: #dbeafe; color: #1e40af; }
    .msg-error   { background: #fee2e2; color: #b91c1c; }
  </style>

</head>
<body>
  {% for message in messages %}
    <p class="msg msg-{{ message.tags }}">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
